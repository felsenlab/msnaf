analyzeVideoWithDLC:
  video_pattern: "*Cam*.mp4"
  dlc_path: "sacnet-josh-2025-01-29/config.yaml" ## GET REAL PATH ON WORKSTATIOn
loadPoseEstimates: ## Needs some work on requires/produces
  file_pattern: "*DLC*.h5"
correctPoseEstimates: ## TODO -- either separate this or it's going to return a BIG dict
  smooth: True
  center: True
  normalize: False
  framerate: 150 ## TODO -- might be able to get from metadata file
  framedrop_threshold: 1.5
  confidence_threshold: 1.0

identifyCandidateSaccades:
  velocity_threshold_percentile: 95
  distance_threshold_samples: 10.5
