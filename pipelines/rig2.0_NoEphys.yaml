initH5:
  metadata_pattern: "metadata.txt"
loadLabJackDataRig2.0: ## Working
    file_pattern: "labjack_data.csv"
    channel_map:
      AIN1: "stimulus"
      FIO6: "camera"
      FI06: "camera"
timestampCameraFrames:
  sampling_rate: 2000
  interval_pattern: "*Cam_timestamps.txt" ## TODO -- where do the intervals get loaded? 

