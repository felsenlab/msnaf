classifyCandidateSaccadesExperimental: 
  saccade_duration_regressor: /home/nick/asdf/felsenlab/sacnet3/models/2025-03-14_21:45:17/regressor.pkl
  template: /home/nick/asdf/repos/flimsy/models/saccade_template.npy
  window_size_time: 0.2
  fieldnames:
    side: ['right']

parseDriftingGratingMetadata:
  #stimulus_channel: #, description="H5 field containing the raw stimulus TTL signal, e.g. labjack/stimulus/raw")
  #median_filter_size: #", default=5, description="Kernel size for median filter used to clean the TTL signal. Must be odd.")
  #inter_block_interval_threshold: #", default=16000, description="Minimum inter-pulse gap in samples that separates stimulus blocks")
  #timing_mismatch_threshold: #", default=0.1, description="Inter-event timing difference in seconds above which a pulse is considered missing")
  #metadata_dir: #", default="videos", description="Subdirectory of basepath containing the metadata files")
  #file_pattern: #", default="driftingGratingMetadata-*.txt", description="Glob pattern for discovering metadata files. Files are sorted in natural order.")
  #n_header_lines: #", default=5, description="Number of non-CSV header lines at the top of each metadata file")
  header_fields:
    event_id: 0
    motion_direction: 1
    probe_contrast: 2
    probe_phase: 3
    timestamp: 4
  column_map:
    event_id: 0
    motion_direction: 1
    probe_contrast: 2
    probe_phase: 3
    timestamp: 4


